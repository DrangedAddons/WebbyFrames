# Releases only when asked: commits pushed to main just land there. A release happens when
# - a push to main has [release] in one of its commit messages (an empty commit will do), or
# - it's started by hand (Actions > Release > Run workflow), or
# - a v* tag is pushed.
# Then the version goes up, the .toc and CHANGELOG get the new number, that is committed back to main and
# tagged, and the zip is published as a GitHub Release (which the Discord announcement picks up).
#
# Versions are major.minor.patch:
# - small changes bump the patch: 1.5 -> 1.5.1 -> 1.5.2
# - a big change bumps the minor and starts the patch again: 1.5.2 -> 1.6.0. Mark it by putting [big] in
#   any commit message since the last release.
# - If the .toc already has a newer version than the last tag (you bumped it by hand), that one is used.
# - If CHANGELOG.md has no section for the new version, one is written from the commit messages.
# - Pushing a v* tag yourself still releases that tag as it is (no bump).
# - The version commit is pushed with the workflow's own token, which doesn't start another run.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['.github/tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # (a plain push to main without [release] does nothing)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(join(github.event.commits.*.message, ' '), '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags and history, for the version and the notes

      - name: Pick the version
        id: ver
        run: |
          LAST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          echo "last=${LAST}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOC=$(grep -m1 '^## Version:' WebbyFrames.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          if [ -z "$LAST" ]; then
            NEW="$TOC"                                     # first release: the .toc's version as it is
          elif [ "$TOC" != "$LAST" ] && [ "$(printf '%s\n%s\n' "$LAST" "$TOC" | sort -V | tail -1)" = "$TOC" ]; then
            NEW="$TOC"                                     # bumped by hand past the last release
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LAST"
            MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
            if git log "v${LAST}..HEAD" --format=%B | grep -qi '\[big\]'; then
              NEW="${MAJOR}.$((10#$MINOR + 1)).0"         # a big change: 1.5.2 -> 1.6.0
            else
              NEW="${MAJOR}.${MINOR}.$((10#$PATCH + 1))"  # a small change: 1.5 -> 1.5.1
            fi
          fi
          if git rev-parse -q --verify "refs/tags/v${NEW}" >/dev/null; then
            echo "Tag v${NEW} already exists" >&2; exit 1
          fi
          echo "Releasing ${NEW} (last release: ${LAST:-none}, .toc: ${TOC})"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "bump=true" >> "$GITHUB_OUTPUT"

      - name: Set the version, commit and tag
        if: steps.ver.outputs.bump == 'true'
        env:
          NEW: ${{ steps.ver.outputs.version }}
          LAST: ${{ steps.ver.outputs.last }}
        run: |
          perl -pi -e 's/^## Version:[^\r\n]*/## Version: $ENV{NEW}/' WebbyFrames.toc
          if ! tr -d '\r' < CHANGELOG.md | grep -qx "## ${NEW}"; then
            # a section from the commits since the last release (not merges, not earlier version commits)
            RANGE="HEAD"; [ -n "$LAST" ] && RANGE="v${LAST}..HEAD"
            git log --no-merges --format='- %s' "$RANGE" | grep -v '^- Release v' > section.md || true
            [ -s section.md ] || echo "- Updates" > section.md
            { echo "## ${NEW}"; cat section.md; echo; } > new.md
            awk 'NR == FNR { s = s $0 "\n"; next } !done && /^## / { printf "%s", s; done = 1 } { print }
                 END { if (!done) printf "%s", s }' new.md CHANGELOG.md > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
            rm -f section.md new.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WebbyFrames.toc CHANGELOG.md
          if ! git diff --cached --quiet; then git commit -m "Release v${NEW}"; fi
          git tag "v${NEW}"
          git push origin HEAD:main "v${NEW}"

      - name: Build zip
        env:
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          mkdir -p build/WebbyFrames
          rsync -a --exclude='.git*' --exclude='.github' --exclude='build' ./ build/WebbyFrames/
          cd build && zip -qr "../WebbyFrames-${TAG}.zip" WebbyFrames

      # Every CHANGELOG section since the previous release, so versions that were never tagged on
      # their own still get announced. Each older version gets its own sub-heading.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PREV=$(git tag -l 'v*' | sed 's/^v//' | sort -V | awk -v v="$VERSION" '$0 == v { exit } { p = $0 } END { print p }')
          echo "Notes from ${VERSION} back to (not including) ${PREV:-the start}"
          tr -d '\r' < CHANGELOG.md | awk -v v="## ${VERSION}" -v p="## ${PREV}" '
            $0 == v { found = 1; next }
            found && p != "## " && $0 == p { exit }
            found && /^## / { if (p == "## ") exit; sub(/^## /, "### "); print; next }
            found { print }
          ' > notes.md
          if [ ! -s notes.md ]; then echo "WebbyFrames v${VERSION}" > notes.md; fi
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          gh release create "${TAG}" "WebbyFrames-${TAG}.zip" --title "WebbyFrames ${TAG}" --notes-file notes.md
